services:
  # 服务端：使用支持 QUIC 的 Nginx 镜像
  server:
    image: nginx:1.25-quic
    container_name: network_server
    volumes:
      - ./assets:/usr/share/nginx/html:ro        # 挂载生成的 100 个文件 [cite: 96, 99]
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # 挂载 H3 配置文件
      - ./server.crt:/etc/nginx/conf.d/server.crt:ro   # 挂载自签名证书
      - ./server.key:/etc/nginx/conf.d/server.key:ro   # 挂载私钥
    ports:
      - "443:443/tcp"
      - "443:443/udp" # 关键：HTTP/3 必须映射 UDP 端口
    networks:
      - lab_net

  # 客户端：用于发起请求并模拟网络损伤
  client:
    image: curlimages/curl:8.5.0 # 使用较新版本以支持 --http3
    container_name: network_client
    tty: true
    cap_add:
      - NET_ADMIN # 关键：允许容器调用 tc 命令修改网络环境 [cite: 52]
    volumes:
      - ./results:/home/curl/results # 方便将抓取的数据直接存入结果目录 [cite: 99]
    networks:
      - lab_net
    depends_on:
      - server

networks:
  lab_net:
    driver: bridge